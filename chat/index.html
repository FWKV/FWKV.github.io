<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat — FWKV</title>
  <meta name="description" content="FWKV chat interface — try the model live." />

  <link rel="icon" href="https://cdn-avatars.huggingface.co/v1/production/uploads/6615494716917dfdc645c44e/sro4XOnALHB4GmjOLxiZC.png" type="image/png" />

  <!-- Fonts: technical mono + quiet humanistic sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* ── tokens ─────────────────────────────────────────── */
    :root {
      --bg:           #06070a;
      --bg-elevated: #0c0e14;
      --surface:     #10131c;
      --border:      #1c2333;
      --blue-dim:    #1a3a5c;
      --blue:        #3d7ab5;
      --blue-bright: #6ba8e0;
      --cyan:        #8ec8f0;
      --text:        #d8e0ec;
      --text-muted:  #7a8ba0;
      --text-faint:  #4a5a6e;
      --white:       #f0f4fa;
      --radius:      2px;
      --font-mono:   "IBM Plex Mono", ui-monospace, monospace;
      --font-sans:   "IBM Plex Sans", system-ui, sans-serif;
    }

    /* ── reset ──────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    img, video { display: block; max-width: 100%; }
    a { color: var(--blue-bright); text-decoration: none; }
    a:hover { color: var(--cyan); text-decoration: underline; text-underline-offset: 3px; }
    a:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }

    /* ── grain overlay ─────────────────────────────────── */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.045;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* ── nav ────────────────────────────────────────────── */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(6, 7, 10, 0.82);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.9rem 0;
      width: min(920px, 92vw);
      margin-inline: auto;
    }
    .nav-logo {
      font-family: var(--font-mono);
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: 0.08em;
      color: var(--white);
      text-decoration: none;
    }
    .nav-logo:hover { color: var(--cyan); text-decoration: none; }
    .nav-links {
      display: flex;
      gap: 1.6rem;
      list-style: none;
    }
    .nav-links a {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      text-decoration: none;
    }
    .nav-links a:hover { color: var(--text); }
    .nav-links a.active {
      color: var(--blue-bright);
    }

    /* ── chat layout ────────────────────────────────────── */
    .chat-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      width: min(720px, 94vw);
      margin: 0 auto;
      min-height: 0;
      padding-top: 1rem;
    }

    /* ── model selector dropdown ────────────────────────── */
    .model-select-bar {
      position: relative;
      flex-shrink: 0;
    }
    .model-select-btn {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      padding: 0.4rem 0.6rem 0.4rem 0.75rem;
      cursor: pointer;
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 0.82rem;
      font-weight: 500;
      transition: border-color 0.15s ease, background 0.15s ease;
      white-space: nowrap;
    }
    .model-select-btn:hover {
      border-color: var(--blue-dim);
      background: var(--bg-elevated);
    }
    .model-select-btn .chevron {
      width: 16px;
      height: 16px;
      color: var(--text-muted);
      transition: transform 0.15s ease;
      flex-shrink: 0;
    }
    .model-select-btn[aria-expanded="true"] .chevron {
      transform: rotate(180deg);
    }

    .model-menu {
      position: absolute;
      bottom: calc(100% + 0.5rem);
      left: 0;
      width: 260px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 10px 10px 0px 0px;
      padding: 0.35rem;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
      z-index: 50;
      display: none;
    }
    .model-menu.open { display: block; }

    .model-option {
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      width: 100%;
      background: transparent;
      border: none;
      border-radius: 8px;
      padding: 0.55rem 0.6rem;
      cursor: pointer;
      text-align: left;
      color: var(--text);
      transition: background 0.12s ease;
    }
    .model-option:hover {
      background: rgba(61, 122, 181, 0.14);
    }
    .model-option-check {
      width: 16px;
      flex-shrink: 0;
      margin-top: 0.15rem;
      color: var(--blue-bright);
    }
    .model-option-check svg {
      display: none;
      width: 16px;
      height: 16px;
    }
    .model-option.selected .model-option-check svg {
      display: block;
    }
    .model-option-text {
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
      min-width: 0;
    }
    .model-option-name {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      font-family: var(--font-sans);
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--white);
    }
    .model-option-desc {
      font-family: var(--font-sans);
      font-size: 0.78rem;
      color: var(--text-muted);
    }
    .model-badge {
      font-family: var(--font-mono);
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--cyan);
      background: rgba(110, 168, 224, 0.14);
      border-radius: 999px;
      padding: 0.12rem 0.5rem;
    }
    .model-divider {
      height: 1px;
      background: var(--border);
      margin: 0.3rem 0.2rem;
    }

    /* ── messages area ──────────────────────────────────── */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem 0.2rem;
      min-height: 0;
    }
    .chat-messages::-webkit-scrollbar {
      width: 4px;
    }
    .chat-messages::-webkit-scrollbar-track {
      background: transparent;
    }
    .chat-messages::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 2px;
    }

    /* ── empty state ────────────────────────────────────── */
    .chat-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      gap: 0.4rem;
    }
    .chat-empty-icon {
      font-size: 2.2rem;
      margin-bottom: 0.6rem;
      opacity: 0.5;
    }
    .chat-empty h2 {
      font-family: var(--font-mono);
      font-weight: 500;
      font-size: 1.15rem;
      color: var(--text);
      letter-spacing: 0.02em;
    }
    .chat-empty p {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--text-faint);
      letter-spacing: 0.03em;
      max-width: 34ch;
      line-height: 1.5;
    }
    .chat-empty .chat-empty-model {
      margin-top: 0.5rem;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--blue-bright);
      letter-spacing: 0.03em;
    }

    /* ── input area ─────────────────────────────────────── */
    .chat-input-wrap {
      flex-shrink: 0;
      padding: 0.8rem 0 1.4rem;
    }
    .chat-input-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 0.45rem 0.6rem 0.45rem 0.95rem;
    }
    .chat-input-row:focus-within {
      border-color: var(--blue-dim);
    }
    .chat-input-row input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 0.92rem;
      padding: 0.45rem 0;
    }
    .chat-input-row input::placeholder {
      color: var(--text-faint);
      font-family: var(--font-mono);
      font-size: 0.78rem;
      letter-spacing: 0.03em;
    }
    .chat-input-row input:disabled { cursor: not-allowed; opacity: 0.5; }
    .chat-send-btn {
      font-family: var(--font-mono);
      font-size: 0.74rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--bg);
      background: var(--blue);
      border: none;
      padding: 0.45rem 0.8rem;
      cursor: pointer;
      transition: background 0.15s ease;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .chat-send-btn:hover:not(:disabled) {
      background: var(--blue-bright);
    }
    .chat-send-btn:disabled {
      background: var(--border);
      color: var(--text-faint);
      cursor: not-allowed;
    }
    .chat-send-btn:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 2px;
    }

    /* ── responsive ─────────────────────────────────────── */
    @media (max-width: 500px) {
      .nav-links { gap: 0.9rem; }
      .nav-links a { font-size: 0.7rem; }
    }
  </style>
</head>
<body>

  <!-- nav -->
  <nav>
    <div class="nav-inner">
      <a href="../index.html" class="nav-logo">FWKV</a>
      <ul class="nav-links">
        <li><a href="../index.html#about">About</a></li>
        <li><a href="../index.html#models">Models</a></li>
        <li><a href="#" class="active">Chat</a></li>
        <li><a href="../index.html#paper">Paper</a></li>
        <li><a href="https://huggingface.co/FWKV" target="_blank" rel="noopener">Hugging Face</a></li>
      </ul>
    </div>
  </nav>

  <!-- chat main -->
  <div class="chat-main">

    <div class="chat-messages" id="chatMessages">
      <div class="chat-empty">
        <div class="chat-empty-icon">◈</div>
        <h2>FWKV Chat</h2>
        <p>Chat is not yet live — a hosted inference endpoint is coming soon.</p>
      </div>
    </div>

    <div class="chat-input-wrap">
      <div class="chat-input-row">
        <div class="model-select-bar">
          <button class="model-select-btn" id="modelSelectBtn" aria-haspopup="listbox" aria-expanded="false">
            <span id="modelSelectLabel">Myosotis</span>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>

          <div class="model-menu" id="modelMenu" role="listbox" aria-label="Select FWKV model">
            <button class="model-option selected" data-model="myosotis" role="option" aria-selected="true">
              <span class="model-option-check">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
              </span>
              <span class="model-option-text">
                <span class="model-option-name">FWKV Myosotis</span>
                <span class="model-option-desc">Smallest, fastest — 50M params</span>
              </span>
            </button>

            <div class="model-divider"></div>

            <button class="model-option" data-model="cyanus" role="option" aria-selected="false">
              <span class="model-option-check">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
              </span>
              <span class="model-option-text">
                <span class="model-option-name">FWKV Cyanus</span>
                <span class="model-option-desc">Mid-size, all-around help</span>
              </span>
            </button>

            <div class="model-divider"></div>

            <button class="model-option" data-model="delphinium" role="option" aria-selected="false">
              <span class="model-option-check">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
              </span>
              <span class="model-option-text">
                <span class="model-option-name">FWKV Delphinium</span>
                <span class="model-option-desc">Largest FWKV model</span>
              </span>
            </button>
          </div>
        </div>

        <input
          type="text"
          placeholder="Message FWKV…"
          disabled
          aria-label="Chat message input"
        />
        <button class="chat-send-btn" disabled>Send</button>
      </div>
    </div>
  </div>

  <script>
    const MODEL_NAMES = {
      myosotis: "Myosotis",
      cyanus: "Cyanus",
      delphinium: "Delphinium",
    };

    const selectBtn = document.getElementById("modelSelectBtn");
    const selectLabel = document.getElementById("modelSelectLabel");
    const menu = document.getElementById("modelMenu");
    const options = document.querySelectorAll(".model-option");

    function closeMenu() {
      menu.classList.remove("open");
      selectBtn.setAttribute("aria-expanded", "false");
    }
    function openMenu() {
      menu.classList.add("open");
      selectBtn.setAttribute("aria-expanded", "true");
    }

    selectBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      menu.classList.contains("open") ? closeMenu() : openMenu();
    });

    document.addEventListener("click", (e) => {
      if (!menu.contains(e.target) && e.target !== selectBtn) closeMenu();
    });

    options.forEach((opt) => {
      opt.addEventListener("click", () => {
        options.forEach((o) => {
          o.classList.remove("selected");
          o.setAttribute("aria-selected", "false");
        });
        opt.classList.add("selected");
        opt.setAttribute("aria-selected", "true");

        const modelKey = opt.dataset.model;
        selectLabel.textContent = MODEL_NAMES[modelKey];
        closeMenu();
      });
    });
  </script>

</body>
</html>
